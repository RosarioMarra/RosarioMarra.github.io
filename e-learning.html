<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materiale didattico · Rosario Marra</title>
<link rel="icon" href="immagini/Logo Rosario Marra nero.png" type="image/png">
<meta name="description" content="Materiale didattico per gli studenti di Rosario Marra: dispense, esercitazioni e slide per materia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0B0E; --bg-2:#111318; --card:#14171D; --card-2:#1A1E26;
  --text:#F2F4F7; --muted:#9AA3B2; --faint:#5F6878;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --blue:#3B8BFF; --blue-soft:rgba(59,139,255,.12);
  --orange:#FF7A1A; --orange-soft:rgba(255,122,26,.12);
  --green:#3DDC97;
  --radius:20px;
  --display:'Space Grotesk',Inter,system-ui,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  --logo-filter:none;
}
:root[data-theme="light"]{
  --bg:#F7F7F4; --bg-2:#EFEFEA; --card:#FFFFFF; --card-2:#F5F5F1;
  --text:#14161A; --muted:#545C69; --faint:#8A919C;
  --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.14);
  --blue:#1F6FEB; --blue-soft:rgba(31,111,235,.09);
  --orange:#E8620A; --orange-soft:rgba(232,98,10,.09);
  --green:#12A56A;
  --shadow:0 20px 50px -25px rgba(20,22,26,.25);
  --logo-filter:invert(1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;line-height:1.1}
.eyebrow{font-family:var(--mono);font-size:.78rem;color:var(--orange);letter-spacing:.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:10px;margin-bottom:18px}
.eyebrow::before{content:"";width:22px;height:1px;background:currentColor}
.accent{color:var(--blue)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:.92rem;transition:transform .2s,background .2s,border-color .2s;border:1px solid transparent;cursor:pointer;font-family:inherit}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{transform:translateY(-2px)}
.btn-ghost{border-color:var(--line-2);color:var(--text);background:transparent}
.btn-ghost:hover{border-color:var(--text)}

/* Nav */
.nav{position:fixed;top:14px;left:0;right:0;z-index:100;padding:0 16px}
.nav-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 12px 10px 20px;border-radius:999px;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line)}
.nav-logo img{height:26px;filter:var(--logo-filter)}
.nav-links{display:flex;gap:4px;list-style:none}
.nav-links a{padding:8px 14px;border-radius:999px;font-size:.9rem;color:var(--muted)}
.nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--line)}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.icon-btn svg{width:18px;height:18px}
.theme-btn .sun{display:none}
:root[data-theme="light"] .theme-btn .sun{display:block}
:root[data-theme="light"] .theme-btn .moon{display:none}

/* Header */
.page-head{padding:150px 0 50px;position:relative;overflow:hidden}
.page-head::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(600px 300px at 85% 0%,var(--blue-soft),transparent 70%),radial-gradient(400px 260px at 0% 100%,var(--orange-soft),transparent 70%)}
.page-head h1{font-size:clamp(2.4rem,5.5vw,4rem);margin-bottom:18px;max-width:780px}
.page-head p{color:var(--muted);font-size:1.12rem;max-width:620px}

section{padding:50px 0 90px}
.sec-title{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.sec-title h2{font-size:clamp(1.7rem,3vw,2.3rem)}

/* Materiali */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:13px 16px 13px 44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:.95rem;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--blue)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filter{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:.86rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.2s}
.filter:hover{border-color:var(--line-2);color:var(--text)}
.filter.on{background:var(--blue);border-color:var(--blue);color:#fff}
.filter small{font-family:var(--mono);font-size:.72rem;opacity:.75}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.file{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--card);transition:border-color .2s,transform .2s}
.file:hover{border-color:var(--blue);transform:translateY(-3px)}
.ext{width:52px;height:60px;border-radius:10px;flex-shrink:0;display:grid;place-items:end center;padding-bottom:9px;font-family:var(--mono);font-size:.68rem;font-weight:500;color:#fff;position:relative;background:var(--faint)}
.ext::before{content:"";position:absolute;top:0;right:0;width:14px;height:14px;background:linear-gradient(225deg,var(--bg) 50%,rgba(255,255,255,.35) 50%);border-radius:0 10px 0 4px}
.ext.pdf{background:#E5484D}.ext.doc,.ext.docx{background:#2F6FE4}.ext.ppt,.ext.pptx{background:#E8620A}.ext.xls,.ext.xlsx,.ext.csv{background:#1E9E62}.ext.zip,.ext.rar{background:#8E5BE8}.ext.py,.ext.js,.ext.html,.ext.ipynb{background:#2A3140}
.file-info{flex:1;min-width:0}
.file-info b{display:block;font-weight:600;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--faint);margin-top:4px}
.file-meta .mat{color:var(--orange)}
.dl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--blue);flex-shrink:0;transition:.2s}
.file:hover .dl{background:var(--blue);color:#fff;border-color:var(--blue)}
.dl svg{width:18px;height:18px}
.empty{padding:60px 20px;text-align:center;border:1px dashed var(--line-2);border-radius:20px;color:var(--muted)}
.skeleton{height:96px;border-radius:16px;background:linear-gradient(90deg,var(--card) 25%,var(--card-2) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}

footer{border-top:1px solid var(--line);padding:36px 0;color:var(--faint);font-size:.88rem}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

@media (max-width:720px){.nav-links{display:none}.files{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo"><img src="Logo Rosario Marra-09.png" alt="Rosario Marra"></a>
    <ul class="nav-links">
      <li><a href="index.html#servizi">Servizi</a></li>
      <li><a href="index.html#progetti">Progetti</a></li>
      <li><a href="index.html#contatti">Contatti</a></li>
      <li><a href="#" class="active">Materiale didattico</a></li>
    </ul>
    <button class="icon-btn theme-btn" id="themeBtn" aria-label="Cambia tema">
      <svg class="moon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 15A9.72 9.72 0 0 1 18 15.75 9.75 9.75 0 0 1 8.25 6c0-1.33.27-2.6.75-3.75A9.75 9.75 0 1 0 21.75 15Z"/></svg>
      <svg class="sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.36.39-1.59 1.59M21 12h-2.25m-.39 6.36-1.59-1.59M12 18.75V21m-4.77-4.23-1.59 1.59M5.25 12H3m4.23-4.77L5.64 5.64M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="page-head">
    <div class="wrap">
      <div class="eyebrow">Studenti</div>
      <h1>Materiale didattico <span class="accent">studenti</span>.</h1>
      <p>Dispense, esercitazioni e slide divise per materia, sempre aggiornate e pronte da scaricare.</p>
      <a href="admin.html" class="btn btn-ghost" style="margin-top:28px">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
        Gestisci materiale (docente)
      </a>
    </div>
  </div>

  <section id="materiali">
    <div class="wrap">
      <div class="sec-title"><h2>Materiali</h2><span id="count" style="color:var(--faint);font-size:.9rem"></span></div>
      <div class="toolbar">
        <label class="search">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="m21 21-5.2-5.2M17.25 10.5a6.75 6.75 0 1 1-13.5 0 6.75 6.75 0 0 1 13.5 0Z"/></svg>
          <input id="q" type="search" placeholder="Cerca un file…" aria-label="Cerca un file">
        </label>
      </div>
      <div class="filters" id="filters"></div>
      <div class="files" id="files">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap foot"><span>© 2025 Rosario Marra</span><a href="index.html">← Torna alla home</a></div></footer>

<script>
(() => {
  // Il manifest viene aggiornato dal pannello admin.html ad ogni caricamento
  const MANIFEST = 'file/index.json';

  const root = document.documentElement;
  let saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  root.dataset.theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.getElementById('themeBtn').onclick = () => {
    root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
  };

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  const fmtDate = d => new Date(d).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });

  let data = { materie: [], files: [] }, active = 'Tutte';
  const filtersEl = document.getElementById('filters'), filesEl = document.getElementById('files'), q = document.getElementById('q');

  function render() {
    const term = q.value.trim().toLowerCase();
    const counts = data.files.reduce((m, f) => (m[f.materia] = (m[f.materia] || 0) + 1, m), {});
    filtersEl.innerHTML = ['Tutte', ...data.materie].map(m =>
      `<button class="filter ${m === active ? 'on' : ''}" data-m="${esc(m)}">${esc(m)} <small>${m === 'Tutte' ? data.files.length : (counts[m] || 0)}</small></button>`).join('');
    const list = data.files
      .filter(f => (active === 'Tutte' || f.materia === active) && (!term || (f.nome + ' ' + f.materia).toLowerCase().includes(term)))
      .sort((a, b) => b.data.localeCompare(a.data));
    document.getElementById('count').textContent = list.length + (list.length === 1 ? ' file' : ' file');
    filesEl.innerHTML = list.length ? list.map(f => {
      const ext = (f.path.split('.').pop() || '').toLowerCase();
      return `<a class="file" href="${esc(f.path)}" download>
        <span class="ext ${esc(ext)}">${esc(ext.toUpperCase().slice(0, 4))}</span>
        <span class="file-info"><b>${esc(f.nome)}</b>
          <span class="file-meta"><span class="mat">${esc(f.materia)}</span><span>${fmtSize(f.size)}</span><span>${fmtDate(f.data)}</span></span></span>
        <span class="dl"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg></span>
      </a>`;
    }).join('') : `<div class="empty" style="grid-column:1/-1">Nessun file trovato${active !== 'Tutte' ? ' per ' + esc(active) : ''}.</div>`;
  }

  filtersEl.addEventListener('click', e => { const b = e.target.closest('.filter'); if (b) { active = b.dataset.m; render(); } });
  q.addEventListener('input', render);

  // cache-busting: GitHub Pages può servire una versione in cache del manifest
  fetch(MANIFEST + '?t=' + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => { data = { materie: j.materie || [], files: j.files || [] }; render(); })
    .catch(() => { filesEl.innerHTML = '<div class="empty" style="grid-column:1/-1">Nessun materiale ancora disponibile.</div>'; });
})();
</script>
</body>
</html>
